<?php
$result = "";
$showTable = false;

if(isset($_POST['check'])){
    $name = $_POST['name'] ?? "";
    $attendance = (int)($_POST['attendance'] ?? 0);
    $midterm = (int)($_POST['midterm'] ?? 0);
    $final = (int)($_POST['final'] ?? 0);

    if(!empty($name)){
        $total = $attendance + $midterm + $final;

        if($total >= 50){
            $result = "Pass";
        } else {
            $result = "Fail";
        }

        $showTable = true;
    }
}
?>

<?php if($showTable){ ?>
        <tr>
            <td><?php echo $name; ?></td>
            <td><?php echo $attendance; ?></td>
            <td><?php echo $midterm; ?></td>
            <td><?php echo $final; ?></td>
            <td><?php echo $attendance + $midterm + $final; ?></td>
            <td><?php echo $result; ?></td>
        </tr>
    </table>
<?php } ?>
