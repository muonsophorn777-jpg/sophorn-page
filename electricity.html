$result = "";
if(isset($_POST['calculate'])){
    $old = $_POST['old'];
    $new = $_POST['new'];

    if($new >= $old){
        $unit = $new - $old;
        $price = $unit * 0.25;
        $result = "ប្រើប្រាស់: $unit kWh | តម្លៃ: $$price";
    } else {
        $result = "លេខថ្មីត្រូវធំជាងលេខចាស់";
    }
}
