<?php
$msg = "";
if(isset($_POST['check'])){
    $phone = $_POST['phone'];

    if(preg_match('/^0[0-9]{8,9}$/', $phone)){
        $msg = "លេខត្រឹមត្រូវ ✅";
    } else {
        $msg = "លេខមិនត្រឹមត្រូវ ❌";
    }
}
?>
